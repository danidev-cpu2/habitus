name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'habitus/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: habitus/package-lock.json

      - name: Install dependencies
        working-directory: habitus
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: habitus
        run: npm run build:pages

      - name: Add SPA fallback for client-side routes
        working-directory: habitus
        run: cp dist/habitus/browser/index.html dist/habitus/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: habitus/dist/habitus/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

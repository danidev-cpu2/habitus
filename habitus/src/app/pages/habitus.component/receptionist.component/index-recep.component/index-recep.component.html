<div class="w-full rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <!-- Header -->
  <div class="mb-6 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Calendario de Citas</h2>

      <p class="mt-1 text-sm text-slate-500">Gestiona y reprograma las citas</p>
    </div>

    <button
      type="button"
      (click)="isAppointmentModalOpen = true"
      class="rounded-xl bg-blue-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-600"
    >
      + Nueva Cita
    </button>
  </div>

  <div
    *ngIf="recentAppointmentMessage"
    class="mb-5 rounded-2xl bg-emerald-100 p-4 text-sm text-emerald-700"
  >
    {{ recentAppointmentMessage }}
  </div>

  <app-new-edit-appointment
    [isOpen]="isAppointmentModalOpen"
    (close)="isAppointmentModalOpen = false"
    (appointmentSaved)="handleAppointmentCreated($event)"
  >
  </app-new-edit-appointment>

  <!-- Calendar -->
  <div class="overflow-hidden rounded-2xl border border-slate-200">
    <!-- Month Header -->
    <div class="flex items-center justify-between border-b border-slate-200 bg-slate-50 px-5 py-4">
      <h3 class="text-lg font-semibold capitalize text-slate-700">
        {{ currentMonth }}
      </h3>

      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="previousWeek()"
          class="rounded-lg border border-slate-200 bg-white p-2 text-slate-600 transition hover:bg-slate-100"
        >
          ←
        </button>

        <button
          type="button"
          (click)="goToToday()"
          class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Hoy
        </button>

        <button
          type="button"
          (click)="nextWeek()"
          class="rounded-lg border border-slate-200 bg-white p-2 text-slate-600 transition hover:bg-slate-100"
        >
          →
        </button>
      </div>
    </div>

    <!-- Days -->
    <div class="grid grid-cols-5 border-b border-slate-200 bg-slate-50">
      <div
        *ngFor="let day of currentWeek"
        class="border-r border-slate-200 p-3 text-center last:border-r-0"
        [ngClass]="day.isToday ? 'bg-blue-50' : ''"
      >
        <p class="text-xs text-slate-400">
          {{ day.dayName }}
        </p>

        <p class="mt-1 font-semibold" [ngClass]="day.isToday ? 'text-blue-600' : 'text-slate-700'">
          {{ day.dayNumber }}
        </p>
      </div>
    </div>

    <!-- Appointments -->
    <div class="grid grid-cols-5 min-h-[320px]">
      <div
        *ngFor="let dayAppointments of getAppointmentsByDay(); let dayIndex = index"
        class="border-r border-slate-200 p-2 space-y-2"
        [ngClass]="dayIndex === 4 ? 'last:border-r-0' : ''"
      >
        <div
          *ngFor="let appointment of dayAppointments"
          class="rounded-xl p-3 transition hover:shadow-sm"
          [ngClass]="[
            getPsychologistColor(appointment).border,
            getPsychologistColor(appointment).bg,
          ]"
        >
          <p class="text-xs font-medium" [ngClass]="getPsychologistColor(appointment).text">
            {{ appointment.hour }}
          </p>
          <p class="mt-1 text-sm font-semibold text-slate-700">{{ appointment.patient.name }}</p>
          <p class="text-xs text-slate-500">{{ appointment.psychologist.name }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="mt-5 flex flex-wrap items-center gap-5 text-sm">
    <div *ngFor="let psychologist of getActivePsychologists()" class="flex items-center gap-2">
      <span class="h-3 w-3 rounded-full" [ngClass]="psychologist.color.dot"></span>

      <span class="text-slate-600"> {{ psychologist.name }} {{ psychologist.surname }} </span>
    </div>
  </div>
</div>

<div class="min-h-screen bg-[#F8FAFC]">
  <aside class="fixed top-0 left-0 z-50 h-full w-72 bg-white border-r border-slate-200">
    <div class="flex flex-col h-full p-6">
      <div class="flex items-center gap-3 mb-10">
        <div
          class="w-9 h-9 bg-[#4F84D4] rounded-lg flex items-center justify-center text-white font-bold text-lg"
        >
          H
        </div>
        <span class="font-bold text-xl text-slate-800 tracking-tight">Habitus</span>
        <span
          class="ml-2 px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] font-bold uppercase rounded border border-slate-200"
        >
          {{ this.getUserRole() }}
        </span>
      </div>

      <nav class="flex-1 space-y-1">
        @for (item of navItems; track item.href) {
          <a
            [routerLink]="item.href"
            routerLinkActive="active-menu-item bg-[#4F84D4] text-white shadow-lg shadow-blue-100"
            [routerLinkActiveOptions]="{
              exact:
                item.href === '/paciente' ||
                item.href === '/psicologo' ||
                item.href === '/recepcion' ||
                item.href === '/admin',
            }"
            class="menu-link flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all duration-200 text-slate-500 hover:bg-[#4F84D4] hover:text-white no-underline decoration-none"
          >
            <lucide-icon
              [name]="item.icon"
              class="w-5 h-5 opacity-70 group-hover:opacity-100"
            ></lucide-icon>
            <span class="flex-1 no-underline decoration-none">{{ item.label }}</span>

            @if (item.badge) {
              <span
                class="bg-[#4F84D4] text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center shadow-sm"
              >
                {{ item.badge }}
              </span>
            }
          </a>
        }
      </nav>

      <div class="pt-6 border-t border-slate-100">
        <div class="flex items-center gap-3 mb-4 px-2">
          <div
            class="w-11 h-11 rounded-full bg-[#E0E7FF] border-2 border-white shadow-sm flex items-center justify-center text-[#4F84D4] font-bold text-sm"
          >
            {{ getInitials() }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-slate-800 truncate">{{ getUserName() }}</p>
            <p class="text-xs text-slate-400 truncate">{{ getUserEmail() }}</p>
          </div>
        </div>

        <button
          (click)="logout()"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5 border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all cursor-pointer"
        >
          <lucide-icon [name]="icons.LogOut" class="w-4 h-4"></lucide-icon>
          Cerrar Sesión
        </button>
      </div>
    </div>
  </aside>

  <main class="pl-72 min-h-screen">
    <div class="p-8 lg:p-12 max-w-[1600px] mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

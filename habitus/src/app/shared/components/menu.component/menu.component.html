<div class="min-h-screen bg-background">
  <header
    class="lg:hidden fixed top-0 left-0 right-0 z-50 bg-card border-b border-border h-16 flex items-center justify-between px-4"
  >
    <a [routerLink]="navItems[0]?.href || '/'" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
        <lucide-icon [name]="icons.Brain" class="w-5 h-5 text-primary-foreground"></lucide-icon>
      </div>
      <span class="font-semibold text-foreground">Habitus</span>
    </a>
    <button
      class="inline-flex items-center justify-center rounded-md p-2 hover:bg-muted text-foreground"
      (click)="toggleSidebar()"
    >
      <lucide-icon [name]="sidebarOpen ? icons.X : icons.Menu" class="w-5 h-5"></lucide-icon>
    </button>
  </header>

  @if (sidebarOpen) {
    <div class="lg:hidden fixed inset-0 bg-foreground/20 z-40" (click)="closeSidebar()"></div>
  }

  <aside
    [class]="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
    class="fixed top-0 left-0 z-50 h-full w-64 bg-card border-r border-border transform transition-transform duration-200 ease-in-out lg:translate-x-0"
  >
    <div class="flex flex-col h-full">
      <div class="h-16 flex items-center gap-2 px-6 border-b border-border">
        <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
          <lucide-icon [name]="icons.Brain" class="w-5 h-5 text-primary-foreground"></lucide-icon>
        </div>
        <span class="font-semibold text-foreground">Habitus</span>
      </div>

      <nav class="flex-1 p-4 space-y-1">
        @for (item of navItems; track item.href) {
          <a
            [routerLink]="item.href"
            routerLinkActive="bg-primary text-primary-foreground"
            [routerLinkActiveOptions]="{
              exact:
                item.href === '/paciente' ||
                item.href === '/psicologo' ||
                item.href === '/recepcion' ||
                item.href === '/admin',
            }"
            (click)="closeSidebar()"
            class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors text-muted-foreground hover:bg-muted hover:text-foreground"
          >
            <lucide-icon [name]="item.icon" class="w-5 h-5"></lucide-icon>
            {{ item.label }}
            @if (item.badge) {
              <span
                class="ml-auto bg-primary text-primary-foreground text-xs rounded-full px-2 py-0.5"
              >
                {{ item.badge }}
              </span>
            }
          </a>
        }
      </nav>

      <div class="p-4 border-t border-border">
        <div class="flex items-center gap-3 px-4 py-3">
          <div class="w-8 h-8 rounded-full bg-muted flex items-center justify-center">
            <span class="text-sm font-medium text-muted-foreground">{{ getInitials() }}</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-foreground truncate">{{ getUserName() }}</p>
            <p class="text-xs text-muted-foreground truncate">{{ getUserEmail() }}</p>
          </div>
        </div>
        <button
          (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-2 mt-2 rounded-lg text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors cursor-pointer"
        >
          <lucide-icon [name]="icons.LogOut" class="w-4 h-4"></lucide-icon>
          Cerrar sesión
        </button>
      </div>
    </div>
  </aside>

  <main class="lg:pl-64 pt-16 lg:pt-0 min-h-screen">
    <div class="p-6 lg:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
